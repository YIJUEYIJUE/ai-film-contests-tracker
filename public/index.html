<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13191c" media="(prefers-color-scheme: dark)">

<script>(function(){try{var t=localStorage.getItem('aicontest.v6.theme');if(!t||t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>

<body>
<a class="skip" href="#view">跳到主要内容</a>
<div class="shell">
  <aside class="side" aria-label="主导航">
    <a class="brand" href="#/home">
      <span class="brand-t"><b>AI赛事助手</b><i>AI 影像赛事截止追踪</i></span>
    </a>
    <nav class="nav" id="tabs"></nav>
    <div class="side-foot">
      <button class="side-theme" data-act="theme" aria-label="切换深浅色">
        <svg class="i-sun" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.4 4.4l1.5 1.5M14.1 14.1l1.5 1.5M15.6 4.4l-1.5 1.5M5.9 14.1l-1.5 1.5"/></svg>
        <svg class="i-moon" viewBox="0 0 20 20"><path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"/></svg>
        <span class="t-light">浅色</span><span class="t-dark">深色</span>
      </button>
      <p class="snap" id="snap"></p>
    </div>
  </aside>
  <div class="main-col">
    <header class="topbar">
      <a class="m-brand" href="#/home" aria-label="AI赛事助手">AI赛事助手</a>
      <button class="search-btn" data-act="search" aria-label="搜索赛事">
        <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
        <span>搜索赛事、主办方、地区</span><kbd id="kbd">⌘K</kbd>
      </button>
      <div class="top-r">
        <span class="today" id="today"></span>
        <button class="icon-btn m-only" data-act="theme" aria-label="切换深浅色"><svg viewBox="0 0 20 20"><path d="M16 12.5A7 7 0 0 1 7.5 4a7 7 0 1 0 8.5 8.5z"/></svg></button>
      </div>
      <div class="prog" id="prog"></div>
    </header>
    <div id="notice"></div>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">
      <span>截止日期、报名费与规则以主办方官网为准；标注「待确认」的赛事，投递前请先自行核对。</span>
    </footer>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="快捷导航"></nav>
<div class="search" id="search" role="dialog" aria-modal="true" aria-label="搜索">
  <div class="search-box">
    <div class="search-in">
      <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg>
      <input id="sq" placeholder="搜索赛事名称、主办方、地区，或输入页面名" autocomplete="off">
      <kbd>Esc</kbd>
    </div>
    <div class="search-list" id="sres"></div>
    <div class="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>/</kbd> 随时唤起</span></div>
  </div>
</div>
<div class="sheet-mask" id="mask" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="赛事详情"></aside>
<div class="toasts" id="toasts" aria-live="polite"></div>
<button class="totop" id="totop" data-act="top" aria-label="回到顶部"><svg viewBox="0 0 20 20"><path d="m5 12 5-5 5 5"/></svg></button>
