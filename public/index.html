<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">

<script>(function(){try{var t=(JSON.parse(localStorage.getItem('aicontest.v1')||'{}').prefs||{}).theme;if(!t||t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})()</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="AI赛事助手 · AI 视频赛事截止追踪">
<meta property="og:description" content="截止雷达、分级精选、影片资料、资格匹配与投递计划。">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="prog" id="prog"></div>
<a class="skip" href="#view">跳到正文</a>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/home" aria-label="AI赛事助手 首页">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 6.5v11l9-5.5z" fill="currentColor" stroke="none"/></svg></span>
      <span class="brand-t"><b>AI赛事助手</b><small>AI Film Contest Assistant</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="side-card" id="sideCard"></div>
    <div class="side-foot">
      <div class="side-tools"><button class="icon-btn" data-notify title="开启截止通知"><svg viewBox="0 0 20 20"><path d="M5 8a5 5 0 0 1 10 0c0 5 2 6 2 6H3s2-1 2-6M8.5 17a1.8 1.8 0 0 0 3 0"/></svg></button><button class="icon-btn" data-help title="快捷键（?）"><svg viewBox="0 0 20 20"><rect x="2.5" y="5" width="15" height="10" rx="2"/><path d="M5.5 8h.01M8.5 8h.01M11.5 8h.01M14.5 8h.01M6 12h8"/></svg></button></div>
      <div class="theme-seg" role="group" aria-label="主题"><button data-theme-set="light" title="浅色">☀︎</button><button data-theme-set="auto" title="跟随系统">◐</button><button data-theme-set="dark" title="深色">☾</button></div>
      <span class="snap" id="snap"></span>
    </div>
  </aside>
  <div class="scrim" id="scrim" data-act="closeSide"></div>
  <div class="main-wrap">
    <header class="topbar" id="topbar">
      <button class="icon-btn only-m" data-act="openSide" aria-label="菜单"><svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h9"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="film-bar" id="filmBar"></div>
      <button class="search-pill" data-act="palette"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg><span>搜索赛事、主办方、电影节…</span><kbd id="kbd">⌘K</kbd></button>
      <div class="top-r">
        <span class="today" id="today"></span>
        <a class="btn-grad" href="#/brief"><svg viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z"/><path d="M12 2.5V6h3.5M7.5 10h5M7.5 13h5"/></svg><span>今日简报</span></a>
      </div>
    </header>
    <div id="banner"></div>
    <main id="view" tabindex="-1"></main>
    <footer class="foot" id="foot"></footer>
  </div>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div class="drawer-mask" id="mask" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="赛事详情"></aside>
<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="搜索">
  <div class="pal-box">
    <div class="pal-in"><svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4"/></svg><input id="palQ" placeholder="搜索赛事、主办方、电影节，或输入页面名…" autocomplete="off"><kbd>Esc</kbd></div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-hint"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>/</kbd> 随时唤起</span></div>
  </div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<button class="totop" id="totop" data-top aria-label="回到顶部"><svg viewBox="0 0 20 20"><path d="m5 12 5-5 5 5"/></svg></button>
<script src="data/data.js"></script>
<script src="assets/app.js"></script>

</html>
